name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project site URL: https://dic-isds.github.io/project_collection/
      # With a custom domain, set SITE_URL to it and BASE_PATH to "/".
      SITE_URL: https://dic-isds.github.io
      BASE_PATH: /project_collection
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: "24"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
